<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CUBESCAPED</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="game">

    <h1>CUBESCAPED</h1>

    <p class="subtitle">
        Can you reach the end with the Treasure?
    </p>

    <div class="hud">
        <div class="hud-box energy-box">
            <span>
                Energy: <strong id="energy">100</strong>
            </span>

            <div class="energy-bar">
                <div id="energy-fill"></div>
            </div>
        </div>

        <div class="hud-box">
            Treasure: <span id="treasure">NO</span>
        </div>
    </div>

    <div class="level-display">
        <span id="level-number">1</span>
    </div>

    <div class="maze-wrap">
        <div id="maze"></div>
    </div>

    <div class="controls">
        <button class="control empty" tabindex="-1">.</button>

        <button class="control" data-dir="up">
            ▲
        </button>

        <button class="control empty" tabindex="-1">.</button>

        <button class="control" data-dir="left">
            ◀
        </button>

        <button class="control" data-dir="down">
            ▼
        </button>

        <button class="control" data-dir="right">
            ▶
        </button>
    </div>

    <div class="instructions">
        <span>Move: Arrow Keys / WASD</span>
        <span>Mobile: Use the buttons</span>
    </div>

    <button class="reset" id="reset">
        Restart Level
    </button>

</main>

<div id="win-screen" class="win-screen">
    <div class="win-box">

        <h2 id="win-title">
            YOU ESCAPED!
        </h2>

        <p id="win-message">
            You found the treasure.<br>
            <em>But did you find everything?</em>
        </p>

        <button id="win-restart" class="reset">
            Play Again
        </button>

    </div>
</div>


<script src="js/levels.js"></script>
<script src="js/game.js"></script>

</body>

</html>
