<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CUBESCAPED</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

<link rel="icon" href="data:image/svg+xml,
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>
        <path fill='%23ff8c00' d='M32 4 58 18 32 32 6 18z'/>
        <path fill='%23d96b00' d='M6 18v28l26 14V32z'/>
        <path fill='%23a65300' d='M58 18v28L32 60V32z'/>
    </svg>"
/>

</head>

<body>

<main class="game">

    <h1>CUBESCAPED</h1>

    <p class="subtitle">
        Can you reach the end with the Treasure?
    </p>

    <div class="hud">
        <div class="hud-box energy-box">
            <span>
                Energy: <strong id="energy">100</strong>
            </span>

            <div class="energy-bar">
                <div id="energy-fill"></div>
            </div>
        </div>

        <div class="hud-box treasure-box">
            <span>Treasure:</span>
            <span id="treasure"></span>
        </div>
    </div>

    <div class="level-display">
        <span id="level-number">1</span>
    </div>

    <div class="maze-wrap">
        <div id="maze"></div>
    </div>

    <div class="instructions">
        <span>Move using Arrow Keys / WASD or just use these buttons</span>
    </div>

    <div class="controls">
        <button class="control empty" tabindex="-1">.</button>

        <button class="control" data-dir="up">
            <i class="fa-solid fa-arrow-up"></i>
        </button>

        <button class="control empty" tabindex="-1">.</button>

        <button class="control" data-dir="left">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <button class="control" data-dir="down">
            <i class="fa-solid fa-arrow-down"></i>
        </button>

        <button class="control" data-dir="right">
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

    <button id="reset" class="reset">
        <i class="fa-solid fa-rotate-right"></i>
        &nbsp;Restart Level
    </button>

</main>

<div id="win-screen" class="win-screen">
    <div class="win-box">

        <h2 id="win-title">
            YOU ESCAPED!
        </h2>

        <p id="win-message">
            You found the treasure.<br>
            <em>but something's still hidden?</em>
        </p>

        <button id="win-restart" class="reset">
            Play Again
        </button>

    </div>
</div>


<script src="js/levels.js"></script>
<script src="js/game.js"></script>

</body>

</html>
